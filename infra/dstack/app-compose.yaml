# dstack / Phala CVM app-compose for tinycloud-private-transcription (V1).
# ONE CVM runs: our api + worker + postgres + redis, and the pinned TinyCloud Vexa capture stack
# (control plane + CPU whisper) that spawns meeting bots. Deploy:
#   phala deploy -n ptx-dev -c infra/dstack/app-compose.yaml -e infra/dstack/.env -t tdx.large --disk-size 40G
# Encrypted env (never in this file): POSTGRES_PASSWORD, VEXA_DB_PASSWORD, VEXA_ADMIN_TOKEN,
# VEXA_INTERNAL_API_SECRET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
# TRANSCRIPTION_PROVIDER (PTX compatibility label; does not configure Vexa's STT endpoint),
# VEXA_ADMIN_IMAGE / VEXA_RUNTIME_IMAGE / VEXA_AGENT_IMAGE / VEXA_AGENT_WORKER_IMAGE
# (digest-pinned v012 upstream components),
# PTX_BOT_IMAGE (fork bot image override; defaults to the pinned fork image below).
# The PTX API/worker and three-seat Signal Desktop images are immutable production pins in this
# file, not sealed-environment overrides. Signal profile volumes are deliberately persistent:
# linking each Signal account is an operator action, never a deployment side effect.
#
# Vexa service topology mirrors infra/vexa/upstream/deploy/compose/docker-compose.yml. Bot,
# meeting-api, and gateway are pinned to the accepted TinyCloud fork merge; unchanged components
# remain on upstream v0.12 images. Agent-api/mcp/terminal are omitted because V1 does not need them.
#
# BOT SPAWNING NEEDS THE DOCKER SOCKET: Vexa's `runtime` creates one container per meeting bot
# (BROWSER_IMAGE = the fork bot image, ~3.6 GB, Chromium+Xvfb+PulseAudio) through
# /var/run/docker.sock, on the compose network named below (DOCKER_NETWORK) so the bot resolves
# meeting-api:8080, redis and whisper:8000. dstack runs docker inside the CVM, so the socket exists;
# if a given dstack/Phala policy rejects the bind mount, the fallback plan is Vexa's "process backend"
# (Vexa Lite: run the bot in-process / as a sibling compose service instead of docker-spawned
# containers) — see docs/vexa-findings.md and the README "CVM plan" section.

services:
  # ─── ours ────────────────────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:0c5b5ae12a1ea417d39e55e2291963393480222b@sha256:574e7106f93cb1bf730a816ada12a2e3d2fa545b149a8dce2308b09ddb303005
    # VEXA_API_KEY is minted at first boot by `vexa-provision` (below) into a shared volume.
    command: ["sh", "-c", "for i in $(seq 1 60); do [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && break; sleep 2; done; [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] || exit 1; export VEXA_API_KEY=$(cat /run/vexa/api-key) SIGNAL_CAPABILITY_KEY=$(cat /run/signal-capability/capability-key); exec bun run src/api/server.ts"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    # This is startup liveness only. Publication readiness remains fail-closed on /health, but
    # cannot gate this worker because the worker itself establishes that readiness.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD}@postgres:5432/ptx
      REDIS_URL: redis://redis:6379
      VEXA_BASE_URL: http://gateway:8000
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-vexa}
      ATTRIBUTED_TRANSCRIPTION_ENABLED: "true"
      TINFOIL_BASE_URL: ${TINFOIL_BASE_URL:-https://inference.tinfoil.sh}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      TINFOIL_MODEL: ${TINFOIL_MODEL:-voxtral-small-24b}
      # Platforms POST /v1/meetings accepts in the production stack. Keep this explicit so a
      # stale sealed environment cannot silently disable a shipped capture backend.
      ENABLED_PLATFORMS: jitsi,google_meet,signal
      AUTO_MIGRATE: "true"
      LOG_LEVEL: info
      SIGNAL_MAX_CONCURRENT_CALLS: "3"
      SIGNAL_HEALTH_PATHS: /run/signal-health-1/health.json,/run/signal-health-2/health.json,/run/signal-health-3/health.json
    volumes:
      - vexa-provision:/run/vexa:ro
      # Keep the existing volume name so upgrades preserve the already-generated AES key.
      - signal-runtime:/run/signal-capability:ro
      - signal-health:/run/signal-health-1:ro
      - signal-health-2:/run/signal-health-2:ro
      - signal-health-3:/run/signal-health-3:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [ptx, vexa]

  worker:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:0c5b5ae12a1ea417d39e55e2291963393480222b@sha256:574e7106f93cb1bf730a816ada12a2e3d2fa545b149a8dce2308b09ddb303005
    command: ["sh", "-c", "for i in $(seq 1 60); do [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && [ -s /run/signal-control-1/token ] && [ -s /run/signal-control-2/token ] && [ -s /run/signal-control-3/token ] && break; sleep 2; done; [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && [ -s /run/signal-control-1/token ] && [ -s /run/signal-control-2/token ] && [ -s /run/signal-control-3/token ] || exit 1; export VEXA_API_KEY=$(cat /run/vexa/api-key) SIGNAL_CAPABILITY_KEY=$(cat /run/signal-capability/capability-key); exec bun run src/worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD}@postgres:5432/ptx
      REDIS_URL: redis://redis:6379
      VEXA_BASE_URL: http://gateway:8000
      VEXA_POLL_INTERVAL_MS: "5000"
      # Per-meeting Vexa remote-participant audio silence window. Avoid the upstream ten-minute
      # fallback so an empty or silent meeting releases capacity sooner on Jitsi or Google Meet.
      VEXA_MAX_TIME_LEFT_ALONE_MS: ${VEXA_MAX_TIME_LEFT_ALONE_MS:-300000}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-vexa}
      ATTRIBUTED_TRANSCRIPTION_ENABLED: "true"
      TINFOIL_BASE_URL: ${TINFOIL_BASE_URL:-https://inference.tinfoil.sh}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      TINFOIL_MODEL: ${TINFOIL_MODEL:-voxtral-small-24b}
      # Each seat has a private control network and token. Its unauthenticated CDP remains bound
      # only to that seat's own loopback namespace.
      SIGNAL_CAPTURE_URLS: http://signal-capture:18076,http://signal-capture-2:18077,http://signal-capture-3:18078
      SIGNAL_CAPTURE_TOKEN_PATHS: /run/signal-control-1/token,/run/signal-control-2/token,/run/signal-control-3/token
      SIGNAL_MAX_CONCURRENT_CALLS: "3"
      LOG_LEVEL: info
    volumes:
      - vexa-provision:/run/vexa:ro
      - signal-runtime:/run/signal-capability:ro
      - signal-control-1:/run/signal-control-1:ro
      - signal-control-2:/run/signal-control-2:ro
      - signal-control-3:/run/signal-control-3:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [ptx, vexa, signal-seat-1, signal-seat-2, signal-seat-3]

  # Three independently linked Signal Desktops. Separate network namespaces keep each
  # unauthenticated CDP endpoint loopback-only and unreachable from sibling Signal containers.
  # Seat 1 retains the original service/volume names so an in-place upgrade preserves its link.
  signal-capture:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/signal-seat:c3cdff63e429720a79903384509337f3e67caf3d@sha256:1ebac9dc13cf868131abf9a1719b3a3a268058cae59e228bcddc75e51c57cf4f
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      SIGNAL_CAPTURE_BIND: 0.0.0.0
      SIGNAL_CAPTURE_PORT: "18076"
      SIGNAL_CAPTURE_TOKEN_PATH: /run/signal-control/token
      SIGNAL_CDP_URL: http://127.0.0.1:9222
      SIGNAL_CDP_PORT: "9222"
      SIGNAL_VNC_PORT: "5900"
      SIGNAL_NOVNC_PORT: "6080"
      SIGNAL_PULSE_SOURCE: ${SIGNAL_PULSE_SOURCE:-ptx_sink.monitor}
      SIGNAL_TRANSCRIBER: "/opt/ptx/signal-transcriber"
      SIGNAL_WHISPER_URL: http://whisper:8000/v1/audio/transcriptions
      SIGNAL_WHISPER_HEALTH_URL: http://whisper:8000/health
      SIGNAL_WHISPER_MODEL: small.en
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      SIGNAL_PROFILE_DIR: /var/lib/signal
      SIGNAL_HEALTH_PATH: /run/signal-health/health.json
    volumes:
      - signal-profile:/var/lib/signal
      - signal-health:/run/signal-health
      - signal-control-1:/run/signal-control:ro
    depends_on:
      whisper:
        condition: service_healthy
      signal-control-provision:
        condition: service_completed_successfully
    networks:
      signal-seat-1: {}
      vexa: {}

  signal-capture-2:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/signal-seat:c3cdff63e429720a79903384509337f3e67caf3d@sha256:1ebac9dc13cf868131abf9a1719b3a3a268058cae59e228bcddc75e51c57cf4f
    restart: unless-stopped
    ports:
      - "127.0.0.1:6081:6081"
    environment:
      SIGNAL_CAPTURE_BIND: 0.0.0.0
      SIGNAL_CAPTURE_PORT: "18077"
      SIGNAL_CAPTURE_TOKEN_PATH: /run/signal-control/token
      SIGNAL_CDP_URL: http://127.0.0.1:9223
      SIGNAL_CDP_PORT: "9223"
      SIGNAL_VNC_PORT: "5901"
      SIGNAL_NOVNC_PORT: "6081"
      SIGNAL_PULSE_SOURCE: ${SIGNAL_PULSE_SOURCE:-ptx_sink.monitor}
      SIGNAL_TRANSCRIBER: "/opt/ptx/signal-transcriber"
      SIGNAL_WHISPER_URL: http://whisper:8000/v1/audio/transcriptions
      SIGNAL_WHISPER_HEALTH_URL: http://whisper:8000/health
      SIGNAL_WHISPER_MODEL: small.en
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      SIGNAL_PROFILE_DIR: /var/lib/signal
      SIGNAL_HEALTH_PATH: /run/signal-health/health.json
    volumes:
      - signal-profile-2:/var/lib/signal
      - signal-health-2:/run/signal-health
      - signal-control-2:/run/signal-control:ro
    depends_on:
      whisper:
        condition: service_healthy
      signal-control-provision:
        condition: service_completed_successfully
    networks:
      signal-seat-2: {}
      vexa: {}

  signal-capture-3:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/signal-seat:c3cdff63e429720a79903384509337f3e67caf3d@sha256:1ebac9dc13cf868131abf9a1719b3a3a268058cae59e228bcddc75e51c57cf4f
    restart: unless-stopped
    ports:
      - "127.0.0.1:6082:6082"
    environment:
      SIGNAL_CAPTURE_BIND: 0.0.0.0
      SIGNAL_CAPTURE_PORT: "18078"
      SIGNAL_CAPTURE_TOKEN_PATH: /run/signal-control/token
      SIGNAL_CDP_URL: http://127.0.0.1:9224
      SIGNAL_CDP_PORT: "9224"
      SIGNAL_VNC_PORT: "5902"
      SIGNAL_NOVNC_PORT: "6082"
      SIGNAL_PULSE_SOURCE: ${SIGNAL_PULSE_SOURCE:-ptx_sink.monitor}
      SIGNAL_TRANSCRIBER: "/opt/ptx/signal-transcriber"
      SIGNAL_WHISPER_URL: http://whisper:8000/v1/audio/transcriptions
      SIGNAL_WHISPER_HEALTH_URL: http://whisper:8000/health
      SIGNAL_WHISPER_MODEL: small.en
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      SIGNAL_PROFILE_DIR: /var/lib/signal
      SIGNAL_HEALTH_PATH: /run/signal-health/health.json
    volumes:
      - signal-profile-3:/var/lib/signal
      - signal-health-3:/run/signal-health
      - signal-control-3:/run/signal-control:ro
    depends_on:
      whisper:
        condition: service_healthy
      signal-control-provision:
        condition: service_completed_successfully
    networks:
      signal-seat-3: {}
      vexa: {}

  signal-control-provision:
    # Per-seat control tokens authenticate PTX without exposing one Desktop's control plane to
    # either sibling seat. They are generated and retained entirely inside the CVM.
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        for dir in /run/signal-control-1 /run/signal-control-2 /run/signal-control-3; do
          [ -s "$$dir/token" ] && continue
          head -c 32 /dev/urandom | base64 | tr -d '\n' > "$$dir/token.next"
          chmod 600 "$$dir/token.next"
          mv "$$dir/token.next" "$$dir/token"
        done
    volumes:
      - signal-control-1:/run/signal-control-1
      - signal-control-2:/run/signal-control-2
      - signal-control-3:/run/signal-control-3
    restart: on-failure

  signal-capability-provision:
    # Generates a stable AES-256 capability key inside the CVM's persistent volume. The key never
    # enters dstack input, a compose environment, logs, or a host-facing port.
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        [ -s /run/signal-capability/capability-key ] && exit 0
        head -c 32 /dev/urandom | base64 | tr -d '\n' > /run/signal-capability/capability-key.next
        chmod 600 /run/signal-capability/capability-key.next
        mv /run/signal-capability/capability-key.next /run/signal-capability/capability-key
        [ -s /run/signal-capability/capability-key ]
    volumes:
      - signal-runtime:/run/signal-capability
    restart: on-failure

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ptx
    volumes:
      - ptx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ptx]

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ptx-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ptx]

  # ─── Vexa capture stack (published images; nothing built) ───────────────────────────────────
  vexa-redis:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - vexa-redis:/data
    networks:
      vexa:
        aliases: [redis]   # upstream services + bots hardcode redis://redis:6379/0 on this network
    restart: unless-stopped

  vexa-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VEXA_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - vexa-postgres:/var/lib/postgresql/data
    networks: [vexa]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    networks: [vexa]
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb -p local/vexa || true
    depends_on:
      minio:
        condition: service_healthy
    networks: [vexa]

  admin-api:
    image: ${VEXA_ADMIN_IMAGE:-vexaai/v012-admin-api:v012@sha256:4c702354384eafe3a933cd537a106b7c15067cfd368a5f6da1a6e675e7e03e04}
    environment:
      DB_HOST: vexa-postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    depends_on:
      vexa-postgres:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  # Vexa's runtime does `docker create` (no pull) for each bot, so the bot image must already be in the CVM's
  # docker image store — AND dstack runs `docker image prune -af` after every `compose up`, which deletes any
  # image no container references. This no-op service makes compose pull the fork bot image at boot (~1.6 GB
  # compressed) and its exited container pins the image so the prune keeps it.
  bot-image-keeper:
    image: ${PTX_BOT_IMAGE:-ghcr.io/tinycloudlabs/vexa/bot:tc-36f0304@sha256:2c6393d4cdb3b5b6172569e3c8b33b902c841beed5e1a548fddb8d9358200857}
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none

  runtime:
    image: ${VEXA_RUNTIME_IMAGE:-vexaai/v012-runtime:v012@sha256:a1f6448fbb380b9433364e8b572ec25a12aa4f274bf403f1d83a89cbf5812f2d}
    group_add: ["0"]
    environment:
      BROWSER_IMAGE: ${PTX_BOT_IMAGE:-ghcr.io/tinycloudlabs/vexa/bot:tc-36f0304@sha256:2c6393d4cdb3b5b6172569e3c8b33b902c841beed5e1a548fddb8d9358200857}
      AGENT_IMAGE: ${VEXA_AGENT_IMAGE:-vexaai/v012-agent-api:v012@sha256:6eb37574b33aab233aabbe5907e06e106bae44a403e5df781a436da8201a928d}
      AGENT_WORKER_IMAGE: ${VEXA_AGENT_WORKER_IMAGE:-vexaai/v012-agent-worker:v012@sha256:a1120b24765ff6b1c86c5f9ddee35b5e71fdbb9543a23b918b278373ad705022}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      LOG_LEVEL: info
      # Bots are spawned onto THIS network (fixed name below) so they resolve meeting-api/redis/whisper.
      DOCKER_NETWORK: ptx-vexa
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # bot spawning (see header)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      vexa-redis:
        condition: service_healthy
      bot-image-keeper:
        condition: service_completed_successfully
    networks: [vexa]
    restart: unless-stopped

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small.en}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__TTL: "-1"
    volumes:
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [vexa]
    restart: unless-stopped

  meeting-api:
    image: ghcr.io/tinycloudlabs/vexa/meeting-api:tc-36f0304@sha256:2f6f0c162402f13b72569d1a9f5bfb792af75f88b60b9178db85d468405d19e2
    environment:
      DB_HOST: vexa-postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_URL: http://admin-api:8001
      ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN}
      RUNTIME_API_URL: http://runtime:8090
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      DEFAULT_BOT_NAME: TinyCloud Notetaker
      TRANSCRIPTION_SERVICE_URL: http://whisper:8000
      TRANSCRIPTION_SERVICE_TOKEN: local-stt        # faster-whisper-server ignores auth; non-empty marks STT "configured"
      TRANSCRIPTION_MODEL: ""
      TRANSCRIBE_ENABLED: "false"
      ATTRIBUTED_AUDIO_ENABLED: "true"
      RECORDING_ENABLED: "true"                     # preserves Vexa recording playback; PTX does not re-transcribe it
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      BOT_AUTHENTICATED: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      vexa-postgres:
        condition: service_healthy
      vexa-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
      whisper:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  gateway:
    image: ghcr.io/tinycloudlabs/vexa/gateway:tc-36f0304@sha256:0e82c34a3f5838d6f592c71d6e8bebe4e79d3d0414160261def07a57971ef238
    environment:
      ADMIN_API_URL: http://admin-api:8001
      MEETING_API_URL: http://meeting-api:8080
      MCP_URL: http://mcp:8010
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      GUARD_ENABLED: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      admin-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      vexa-redis:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped
    # Not published: only our api/worker talk to Vexa. Vexa's gateway is internal to the CVM.

  # One-shot: create the service-owned Vexa user + `bot,tx` API key and hand it to api/worker.
  vexa-provision:
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -s /run/vexa/api-key ] && { echo "vexa api key already provisioned"; exit 0; }
        H='X-Admin-API-Key: '"$$VEXA_ADMIN_TOKEN"
        until curl -sf http://admin-api:8001/health >/dev/null; do sleep 2; done
        U=$$(curl -sf -H "$$H" http://admin-api:8001/admin/users/email/self-host@vexa.ai || true)
        [ -n "$$U" ] || U=$$(curl -sf -H "$$H" -H 'Content-Type: application/json' -X POST http://admin-api:8001/admin/users -d '{"email":"self-host@vexa.ai","max_concurrent_bots":5}')
        ID=$$(echo "$$U" | sed -n 's/.*"id":[ ]*\([0-9]*\).*/\1/p')
        T=$$(curl -sf -H "$$H" -X POST "http://admin-api:8001/admin/users/$$ID/tokens?scopes=bot,tx")
        echo "$$T" | sed -n 's/.*"token":[ ]*"\([^"]*\)".*/\1/p' > /run/vexa/api-key
        [ -s /run/vexa/api-key ] && echo "vexa api key provisioned for user $$ID"
    environment:
      VEXA_ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN}
    volumes:
      - vexa-provision:/run/vexa
    depends_on:
      admin-api:
        condition: service_healthy
    networks: [vexa]
    restart: on-failure

volumes:
  ptx-postgres:
  ptx-redis:
  vexa-postgres:
  vexa-redis:
  minio-data:
  whisper-cache:
  vexa-provision:
  signal-profile:
  signal-profile-2:
  signal-profile-3:
  # Legacy name retained to preserve the existing capability key across in-place upgrades.
  signal-runtime:
  # Legacy seat-1 health volume name is retained across in-place upgrades.
  signal-health:
  signal-health-2:
  signal-health-3:
  signal-control-1:
  signal-control-2:
  signal-control-3:

networks:
  ptx: {}
  vexa:
    name: ptx-vexa   # fixed: runtime's DOCKER_NETWORK must equal this (bots are attached here)
  signal-seat-1:
    internal: true
  signal-seat-2:
    internal: true
  signal-seat-3:
    internal: true

# Operational notes
# - Bootstrap an API key for callers: `phala ssh -- docker exec <api container> bun run src/cli.ts create-key --project demo`.
# - Sizing (docs/vexa-findings.md): whisper small.en ~1.4 GB RSS + ~10 cores while decoding, one bot
#   ~470 MB + Chromium launch burst, control plane ~1 GB → tdx.large (4 vCPU / 8 GB) is the smallest
#   viable dev size; production wants ≥ tdx.xlarge. Disk ≥ 40 GB (bot image 3.6 GB + whisper model + recordings).
# - Egress: bots join public meetings over the CVM's NAT; only :8080 (our API) is published.
