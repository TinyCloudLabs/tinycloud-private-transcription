# dstack / Phala CVM app-compose for tinycloud-private-transcription (V1).
# ONE CVM runs: our api + worker + postgres + redis, and the pinned TinyCloud Vexa capture stack
# (control plane + CPU whisper) that spawns meeting bots. Update with infra/dstack/deploy-ptx-dev.sh,
# which refuses unless the CVM runs the pinned production OS image (README "Deploy / update").
# Encrypted env (never in this file): POSTGRES_PASSWORD, VEXA_DB_PASSWORD, VEXA_ADMIN_TOKEN,
# VEXA_INTERNAL_API_SECRET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
# TRANSCRIPTION_PROVIDER (PTX compatibility label; does not configure Vexa's STT endpoint),
# VEXA_ADMIN_IMAGE / VEXA_RUNTIME_IMAGE / VEXA_AGENT_IMAGE / VEXA_AGENT_WORKER_IMAGE
# (digest-pinned v012 upstream components),
# PTX_BOT_IMAGE (fork bot image override; defaults to the pinned fork image below),
# PTX_BOOTSTRAP_KEYS (optional hashed API keys for the api service; see .env.example),
# BETTERSTACK_SOURCE_TOKEN (debug-log-shipper; infra/dstack/DEBUG.md).
# The PTX API/worker and Signal Desktop seat images are immutable production pins in this
# file, not sealed-environment overrides. Signal profile volumes are deliberately persistent:
# linking each Signal account is an operator action, never a deployment side effect.
# One Signal seat (TC-901): seats 2 and 3 were never linked and their idle Desktops cost ~800 MB
# on tdx.large. VEXA_MAX_CONCURRENT_BOTS (sealed env, default 2) caps concurrent meeting bots,
# each a ~1-1.2 GB Chromium, so the CVM cannot be driven out of memory (TC-902).
#
# Vexa service topology mirrors infra/vexa/upstream/deploy/compose/docker-compose.yml. Bot,
# meeting-api, and gateway are pinned to the accepted TinyCloud fork merge; unchanged components
# remain on upstream v0.12 images. Agent-api/mcp/terminal are omitted because V1 does not need them.
#
# BOT SPAWNING NEEDS THE DOCKER SOCKET: Vexa's `runtime` creates one container per meeting bot
# (BROWSER_IMAGE = the fork bot image, ~3.6 GB, Chromium+Xvfb+PulseAudio) through
# /var/run/docker.sock, on the compose network named below (DOCKER_NETWORK) so the bot resolves
# meeting-api:8080, redis and whisper:8000. dstack runs docker inside the CVM, so the socket exists;
# if a given dstack/Phala policy rejects the bind mount, the fallback plan is Vexa's "process backend"
# (Vexa Lite: run the bot in-process / as a sibling compose service instead of docker-spawned
# containers) — see docs/vexa-findings.md and the README "CVM plan" section.

services:
  # ─── ours ────────────────────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:3d35edf87e3e84e08b1fffbb630c4e3ec8e92641@sha256:b6f50c4d475f3e292d5fe51b9aab7407702605ecffa67e97d12b9e54cb052f61
    # VEXA_API_KEY is minted at first boot by `vexa-provision` (below) into a shared volume.
    command: ["sh", "-c", "for i in $(seq 1 60); do [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && break; sleep 2; done; [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] || exit 1; export VEXA_API_KEY=$(cat /run/vexa/api-key) SIGNAL_CAPABILITY_KEY=$(cat /run/signal-capability/capability-key); exec bun run src/api/server.ts"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    # This is startup liveness only. Publication readiness remains fail-closed on /health, but
    # cannot gate this worker because the worker itself establishes that readiness.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD}@postgres:5432/ptx
      REDIS_URL: redis://redis:6379
      VEXA_BASE_URL: http://gateway:8000
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-vexa}
      ATTRIBUTED_TRANSCRIPTION_ENABLED: "true"
      TINFOIL_BASE_URL: ${TINFOIL_BASE_URL:-https://inference.tinfoil.sh}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      TINFOIL_MODEL: ${TINFOIL_MODEL:-voxtral-small-24b}
      # Platforms POST /v1/meetings accepts in the production stack. Keep this explicit so a
      # stale sealed environment cannot silently disable a shipped capture backend.
      ENABLED_PLATFORMS: jitsi,google_meet,signal
      AUTO_MIGRATE: "true"
      # Sealed JSON array of hashed API keys the API syncs at boot (see README "API-key scopes").
      # Empty = no bootstrap management; keys minted with `create-key` are never touched.
      PTX_BOOTSTRAP_KEYS: "${PTX_BOOTSTRAP_KEYS:-}"
      LOG_LEVEL: info
      # POST /v1/meetings answers 429 capacity_exhausted once this many meeting bots are live or
      # queued (TC-902). vexa-provision applies the same value to the Vexa user as a backstop.
      VEXA_MAX_CONCURRENT_BOTS: ${VEXA_MAX_CONCURRENT_BOTS:-2}
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      SIGNAL_HEALTH_PATHS: /run/signal-health-1/health.json
    volumes:
      - vexa-provision:/run/vexa:ro
      # Keep the existing volume name so upgrades preserve the already-generated AES key.
      - signal-runtime:/run/signal-capability:ro
      - signal-health:/run/signal-health-1:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [ptx, vexa]

  worker:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:3d35edf87e3e84e08b1fffbb630c4e3ec8e92641@sha256:b6f50c4d475f3e292d5fe51b9aab7407702605ecffa67e97d12b9e54cb052f61
    command: ["sh", "-c", "for i in $(seq 1 60); do [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && [ -s /run/signal-control-1/token ] && break; sleep 2; done; [ -s /run/vexa/api-key ] && [ -s /run/signal-capability/capability-key ] && [ -s /run/signal-control-1/token ] || exit 1; export VEXA_API_KEY=$(cat /run/vexa/api-key) SIGNAL_CAPABILITY_KEY=$(cat /run/signal-capability/capability-key); exec bun run src/worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD}@postgres:5432/ptx
      REDIS_URL: redis://redis:6379
      VEXA_BASE_URL: http://gateway:8000
      VEXA_POLL_INTERVAL_MS: "5000"
      # Per-meeting Vexa remote-participant audio silence window. Avoid the upstream ten-minute
      # fallback so an empty or silent meeting releases capacity sooner on Jitsi or Google Meet.
      VEXA_MAX_TIME_LEFT_ALONE_MS: ${VEXA_MAX_TIME_LEFT_ALONE_MS:-300000}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-vexa}
      ATTRIBUTED_TRANSCRIPTION_ENABLED: "true"
      TINFOIL_BASE_URL: ${TINFOIL_BASE_URL:-https://inference.tinfoil.sh}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      TINFOIL_MODEL: ${TINFOIL_MODEL:-voxtral-small-24b}
      # Attributed Google Meet batches use Whisper: it returns segment timestamps, so published
      # turns interleave on the meeting clock, and it does not answer short clips like a chatbot (TC-740).
      TINFOIL_ATTRIBUTED_MODEL: ${TINFOIL_ATTRIBUTED_MODEL:-whisper-large-v3-turbo}
      # TC-758: untimed fallback after two empty Whisper results, and the attributed retry schedule
      # (6 tries). Shortening the schedule settles over-limit rows exhausted; it never strands them.
      TINFOIL_ATTRIBUTED_FALLBACK_MODEL: ${TINFOIL_ATTRIBUTED_FALLBACK_MODEL:-voxtral-small-24b}
      ATTRIBUTED_RETRY_BACKOFF_MS: ${ATTRIBUTED_RETRY_BACKOFF_MS:-30000,60000,120000,240000,480000}
      # TC-904: retention for Vexa's MinIO artifacts (recordings, attributed audio, signal tapes) of
      # meetings published more than ARTIFACT_RETENTION_DAYS ago. Reference-transcript meetings, running
      # evals, failed (recoverable) meetings and the keep list are never touched. dry-run only logs the
      # plan ("artifact retention plan"); apply deletes. Orphans = artifacts with no ptx meeting.
      ARTIFACT_RETENTION_MODE: ${ARTIFACT_RETENTION_MODE:-dry-run}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-14}
      ARTIFACT_RETENTION_ORPHANS: ${ARTIFACT_RETENTION_ORPHANS:-false}
      # 88 is the eval reference; 74, 84, 87 and 89 hold pre-TC-740/758 transcripts and stay until they are
      # republished through the fixed pipeline or explicitly excluded (TC-989).
      ARTIFACT_RETENTION_KEEP_VEXA_MEETING_IDS: ${ARTIFACT_RETENTION_KEEP_VEXA_MEETING_IDS:-74,84,87,88,89}
      VEXA_MINIO_ENDPOINT: http://minio:9000
      # Least-privilege user provisioned by minio-init (list + delete artifact prefixes only).
      VEXA_MINIO_ACCESS_KEY: ptx-retention
      VEXA_MINIO_SECRET_KEY_FILE: /run/minio-retention/secret-key
      VEXA_MINIO_BUCKET: vexa
      # Internal eval (TC-745): after publication, re-transcribe internal team meetings with these
      # models and keep the results in the ptx DB for comparison (`bun run cli eval report`).
      EVAL_MODELS: ${EVAL_MODELS:-voxtral-small-24b}
      EVAL_TINYCHAT_ADDRESSES: ${EVAL_TINYCHAT_ADDRESSES:-0xd671eece61b27a73a9abbe07aa5b3002626fef5a,0x7d0333579c19e8fa149c2dbf8405cb6f66c373f2,0xd559ccd9eb87c530a9a349262669386de93cf412,0xa8763f2b67aa9c807d2277a698cb071e3d86204a}
      # The seat has a private control network and token. Its unauthenticated CDP remains bound
      # only to the seat's own loopback namespace.
      SIGNAL_CAPTURE_URLS: http://signal-capture:18076
      SIGNAL_CAPTURE_TOKEN_PATHS: /run/signal-control-1/token
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      LOG_LEVEL: info
    volumes:
      - vexa-provision:/run/vexa:ro
      - signal-runtime:/run/signal-capability:ro
      - signal-control-1:/run/signal-control-1:ro
      - minio-retention:/run/minio-retention:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [ptx, vexa, signal-seat-1]

  # One linked Signal Desktop. Its own network namespace keeps the unauthenticated CDP endpoint
  # loopback-only. Seat 1 retains the original service/volume names so an in-place upgrade
  # preserves its link. A further seat is a copy of this service with its own ports, profile,
  # health, control volume and internal network (see git history before TC-901).
  signal-capture:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/signal-seat:c3cdff63e429720a79903384509337f3e67caf3d@sha256:1ebac9dc13cf868131abf9a1719b3a3a268058cae59e228bcddc75e51c57cf4f
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      SIGNAL_CAPTURE_BIND: 0.0.0.0
      SIGNAL_CAPTURE_PORT: "18076"
      SIGNAL_CAPTURE_TOKEN_PATH: /run/signal-control/token
      SIGNAL_CDP_URL: http://127.0.0.1:9222
      SIGNAL_CDP_PORT: "9222"
      SIGNAL_VNC_PORT: "5900"
      SIGNAL_NOVNC_PORT: "6080"
      SIGNAL_PULSE_SOURCE: ${SIGNAL_PULSE_SOURCE:-ptx_sink.monitor}
      SIGNAL_TRANSCRIBER: "/opt/ptx/signal-transcriber"
      SIGNAL_WHISPER_URL: http://whisper:8000/v1/audio/transcriptions
      SIGNAL_WHISPER_HEALTH_URL: http://whisper:8000/health
      # Same name as whisper's WHISPER__MODEL (Vexa's "whisper-1" resolves to it): faster-whisper-server
      # keys loaded models by the requested name, so "small.en" loaded a second copy (TC-901).
      SIGNAL_WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small.en}
      SIGNAL_MAX_CONCURRENT_CALLS: "1"
      SIGNAL_PROFILE_DIR: /var/lib/signal
      SIGNAL_HEALTH_PATH: /run/signal-health/health.json
    volumes:
      - signal-profile:/var/lib/signal
      - signal-health:/run/signal-health
      - signal-control-1:/run/signal-control:ro
    depends_on:
      whisper:
        condition: service_healthy
      signal-control-provision:
        condition: service_completed_successfully
    networks:
      signal-seat-1: {}
      vexa: {}

  signal-control-provision:
    # Per-seat control tokens authenticate PTX without exposing one Desktop's control plane to
    # any other seat. They are generated and retained entirely inside the CVM.
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        for dir in /run/signal-control-1; do
          [ -s "$$dir/token" ] && continue
          head -c 32 /dev/urandom | base64 | tr -d '\n' > "$$dir/token.next"
          chmod 600 "$$dir/token.next"
          mv "$$dir/token.next" "$$dir/token"
        done
    volumes:
      - signal-control-1:/run/signal-control-1
    restart: on-failure

  signal-capability-provision:
    # Generates a stable AES-256 capability key inside the CVM's persistent volume. The key never
    # enters dstack input, a compose environment, logs, or a host-facing port.
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        [ -s /run/signal-capability/capability-key ] && exit 0
        head -c 32 /dev/urandom | base64 | tr -d '\n' > /run/signal-capability/capability-key.next
        chmod 600 /run/signal-capability/capability-key.next
        mv /run/signal-capability/capability-key.next /run/signal-capability/capability-key
        [ -s /run/signal-capability/capability-key ]
    volumes:
      - signal-runtime:/run/signal-capability
    restart: on-failure

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ptx
    volumes:
      - ptx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ptx]

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ptx-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ptx]

  # ─── Vexa capture stack (published images; nothing built) ───────────────────────────────────
  vexa-redis:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - vexa-redis:/data
    networks:
      vexa:
        aliases: [redis]   # upstream services + bots hardcode redis://redis:6379/0 on this network
    restart: unless-stopped

  vexa-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VEXA_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - vexa-postgres:/var/lib/postgresql/data
    networks: [vexa]
    restart: unless-stopped

  minio:
    image: ghcr.io/tinycloudlabs/mirror/minio:RELEASE.2025-09-07T16-13-09Z@sha256:25e301eb686e796ead885d0e254cc6397424df7d7a79cee48ff08b720570ced6
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    networks: [vexa]
    restart: unless-stopped

  minio-init:
    image: ghcr.io/tinycloudlabs/mirror/minio-mc:RELEASE.2025-08-13T08-35-41Z@sha256:4545427b5ba8e7553be881a34db1706dc9b307cbd13e6c9fe9b58faba9d2f380
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # mc reads the root keys from stdin (printf is a shell builtin), so the root password never
        # appears on a command line (ps) (TC-938).
        until printf '%s\n%s\n' "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" | mc alias set local http://minio:9000 >/dev/null; do sleep 1; done
        mc mb -p local/vexa || true
        # TC-904: least-privilege MinIO user for ptx artifact retention: list the vexa bucket and
        # delete under its three artifact prefixes; no read or write. The secret is generated once
        # into the minio-retention volume (never printed) and reapplied every boot. A failure here
        # only leaves retention without credentials; it never fails this init or Vexa. mc reads the
        # secret from stdin, so it never appears on a command line (ps).
        K=/run/minio-retention/secret-key
        { [ -s "$$K" ] || { head -c 20 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$K.tmp" && chmod 0400 "$$K.tmp" && mv "$$K.tmp" "$$K"; }; } &&
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::vexa"]},{"Effect":"Allow","Action":["s3:DeleteObject"],"Resource":["arn:aws:s3:::vexa/recordings/*","arn:aws:s3:::vexa/attributed-audio/*","arn:aws:s3:::vexa/signal/*"]}]}' > /tmp/ptx-retention.json &&
          mc admin policy create local ptx-retention /tmp/ptx-retention.json >/dev/null &&
          mc admin user add local ptx-retention < "$$K" >/dev/null &&
          { mc admin policy attach local ptx-retention --user ptx-retention >/dev/null 2>&1 || mc admin policy entities local --user ptx-retention | grep -q ptx-retention; } &&
          echo "ptx-retention MinIO user ready" || echo "ptx-retention MinIO user setup failed; artifact retention has no credentials"
    volumes:
      - minio-retention:/run/minio-retention
    depends_on:
      minio:
        condition: service_healthy
    networks: [vexa]

  admin-api:
    image: ${VEXA_ADMIN_IMAGE:-vexaai/v012-admin-api:v012@sha256:4c702354384eafe3a933cd537a106b7c15067cfd368a5f6da1a6e675e7e03e04}
    environment:
      DB_HOST: vexa-postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    depends_on:
      vexa-postgres:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  # Vexa's runtime does `docker create` (no pull) for each bot, so the bot image must already be in the CVM's
  # docker image store — AND dstack runs `docker image prune -af` after every `compose up`, which deletes any
  # image no container references. This no-op service makes compose pull the fork bot image at boot (~1.6 GB
  # compressed) and its exited container pins the image so the prune keeps it.
  bot-image-keeper:
    image: ${PTX_BOT_IMAGE:-ghcr.io/tinycloudlabs/vexa/bot:tc-6d44cb4@sha256:efa1e11d9fafc74fdf398a29905b96262ce91002d9d3fdac1159898017d9e8b7}
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none

  # TC-904: Vexa's runtime never removes a finished bot container. Each keeps its local copy of the
  # meeting's signal tapes (~250 MB, already in MinIO) and pins the bot image it ran, so superseded
  # bot images (~4.6 GB each) survive dstack's post-deploy prune too. Every 6 h this removes bot
  # containers (label runtime.managed=true) that finished more than BOT_CONTAINER_RETENTION_DAYS
  # ago, then bot images OLDER than the pinned PTX_BOT_IMAGE that no container uses. The pinned image
  # and anything newer are never touched. BOT_JANITOR_MODE=dry-run (default) only logs; apply removes.
  bot-janitor:
    image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Invalid settings fall back to defaults and never remove anything.
        case "$$BOT_JANITOR_MODE" in apply|dry-run) ;; *) echo "bot-janitor: invalid BOT_JANITOR_MODE; using dry-run"; BOT_JANITOR_MODE=dry-run;; esac
        case "$$BOT_CONTAINER_RETENTION_DAYS" in ''|*[!0-9]*|0*) echo "bot-janitor: invalid BOT_CONTAINER_RETENTION_DAYS; using 7 in dry-run"; BOT_CONTAINER_RETENTION_DAYS=7; BOT_JANITOR_MODE=dry-run;; esac
        case "$$BOT_JANITOR_INTERVAL_SECONDS" in ''|*[!0-9]*|0*) BOT_JANITOR_INTERVAL_SECONDS=21600;; esac
        log() { echo "bot-janitor [$$BOT_JANITOR_MODE] $$*"; }
        act() { if [ "$$BOT_JANITOR_MODE" = apply ]; then "$$@" >/dev/null || log "failed: $$*"; fi; }
        older() { awk -v a="$$1" -v b="$$2" 'BEGIN { exit !(a < b) }'; }
        sweep() {
          cutoff=$$(date -u -d "@$$(( $$(date +%s) - BOT_CONTAINER_RETENTION_DAYS * 86400 ))" +%Y-%m-%dT%H:%M:%S)
          ids=$$(docker ps -aq --filter label=runtime.managed=true --filter status=exited --filter status=dead)
          [ -z "$$ids" ] || docker inspect -f '{{.Id}} {{.State.FinishedAt}} {{.Name}}' $$ids |
            while read -r id finished name; do
              older "$$finished" "$$cutoff" || continue
              log "remove container $$name finished $$finished"; act docker rm "$$id"
            done
          pin=$$(docker image inspect -f '{{.Id}} {{.Created}}' "$$BOT_IMAGE") || { log "pinned bot image missing; not pruning images"; return; }
          docker images --no-trunc --format '{{.Repository}} {{.ID}}' | awk '$$1 == "ghcr.io/tinycloudlabs/vexa/bot" || $$1 == "vexaai/vexa-bot" { print $$2 }' | sort -u |
            while read -r img; do
              [ "$$img" != "$${pin% *}" ] || continue
              created=$$(docker image inspect -f '{{.Created}}' "$$img") || continue
              older "$$created" "$${pin#* }" || continue
              [ -z "$$(docker ps -aq --filter ancestor=$$img)" ] || continue
              log "remove image $$img created $$created"; act docker rmi "$$img"
            done
        }
        while :; do sweep; sleep "$$BOT_JANITOR_INTERVAL_SECONDS"; done
    environment:
      BOT_JANITOR_MODE: ${BOT_JANITOR_MODE:-dry-run}
      BOT_CONTAINER_RETENTION_DAYS: ${BOT_CONTAINER_RETENTION_DAYS:-7}
      BOT_JANITOR_INTERVAL_SECONDS: "21600"
      BOT_IMAGE: ${PTX_BOT_IMAGE:-ghcr.io/tinycloudlabs/vexa/bot:tc-6d44cb4@sha256:efa1e11d9fafc74fdf398a29905b96262ce91002d9d3fdac1159898017d9e8b7}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    restart: unless-stopped

  runtime:
    image: ${VEXA_RUNTIME_IMAGE:-vexaai/v012-runtime:v012@sha256:a1f6448fbb380b9433364e8b572ec25a12aa4f274bf403f1d83a89cbf5812f2d}
    group_add: ["0"]
    environment:
      BROWSER_IMAGE: ${PTX_BOT_IMAGE:-ghcr.io/tinycloudlabs/vexa/bot:tc-6d44cb4@sha256:efa1e11d9fafc74fdf398a29905b96262ce91002d9d3fdac1159898017d9e8b7}
      AGENT_IMAGE: ${VEXA_AGENT_IMAGE:-vexaai/v012-agent-api:v012@sha256:6eb37574b33aab233aabbe5907e06e106bae44a403e5df781a436da8201a928d}
      AGENT_WORKER_IMAGE: ${VEXA_AGENT_WORKER_IMAGE:-vexaai/v012-agent-worker:v012@sha256:a1120b24765ff6b1c86c5f9ddee35b5e71fdbb9543a23b918b278373ad705022}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      LOG_LEVEL: info
      # Bots are spawned onto THIS network (fixed name below) so they resolve meeting-api/redis/whisper.
      DOCKER_NETWORK: ptx-vexa
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # bot spawning (see header)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      vexa-redis:
        condition: service_healthy
      bot-image-keeper:
        condition: service_completed_successfully
    networks: [vexa]
    restart: unless-stopped

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small.en}
      WHISPER__INFERENCE_DEVICE: cpu
      # TC-901: unload the model after 5 idle minutes; the next request lazy-loads it from the cache
      # (~4-8 s on 4 vCPU). /health never needs a loaded model. Live users are Signal (once per
      # finished call) and Jitsi live STT; Google Meet transcribes through Tinfoil. meeting-api's
      # own STT probe reloads it about every 15 minutes. Without the mmap threshold glibc kept
      # ~450 MB of the freed model resident; with it, unload returns the container to ~190 MB.
      WHISPER__TTL: "300"
      MALLOC_MMAP_THRESHOLD_: "1048576"
    volumes:
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [vexa]
    restart: unless-stopped

  meeting-api:
    image: ghcr.io/tinycloudlabs/vexa/meeting-api:tc-63970d8@sha256:0a976dba383951030116296c7c45e0b80b07bbd40ff4d075df5ab564ff9c845e
    environment:
      DB_HOST: vexa-postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_URL: http://admin-api:8001
      ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN}
      RUNTIME_API_URL: http://runtime:8090
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      DEFAULT_BOT_NAME: TinyCloud Notetaker
      TRANSCRIPTION_SERVICE_URL: http://whisper:8000
      TRANSCRIPTION_SERVICE_TOKEN: local-stt        # faster-whisper-server ignores auth; non-empty marks STT "configured"
      TRANSCRIPTION_MODEL: ""
      TRANSCRIBE_ENABLED: "false"
      ATTRIBUTED_AUDIO_ENABLED: "true"
      RECORDING_ENABLED: "true"                     # preserves Vexa recording playback; PTX does not re-transcribe it
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      BOT_AUTHENTICATED: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      vexa-postgres:
        condition: service_healthy
      vexa-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
      whisper:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  gateway:
    image: ghcr.io/tinycloudlabs/vexa/gateway:tc-63970d8@sha256:5a2542727f2f7841032f732595018711b6ee73e0f72cec704e7297532a78e7ec
    environment:
      ADMIN_API_URL: http://admin-api:8001
      MEETING_API_URL: http://meeting-api:8080
      MCP_URL: http://mcp:8010
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET}
      GUARD_ENABLED: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      admin-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      vexa-redis:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped
    # Not published: only our api/worker talk to Vexa. Vexa's gateway is internal to the CVM.

  # One-shot on every boot: create the service-owned Vexa user + `bot,tx` API key and hand it to
  # api/worker, and keep that user's max_concurrent_bots equal to VEXA_MAX_CONCURRENT_BOTS. The
  # user predates the cap, so it is updated in place (PATCH) rather than only set at creation.
  vexa-provision:
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        N="$$VEXA_MAX_CONCURRENT_BOTS"
        case "$$N" in ''|*[!0-9]*|0*) echo "VEXA_MAX_CONCURRENT_BOTS must be a positive integer"; exit 1;; esac
        H='X-Admin-API-Key: '"$$VEXA_ADMIN_TOKEN"
        until curl -sf http://admin-api:8001/health >/dev/null; do sleep 2; done
        U=$$(curl -sf -H "$$H" http://admin-api:8001/admin/users/email/self-host@vexa.ai || true)
        [ -n "$$U" ] || U=$$(curl -sf -H "$$H" -H 'Content-Type: application/json' -X POST http://admin-api:8001/admin/users -d '{"email":"self-host@vexa.ai","max_concurrent_bots":'"$$N"'}')
        ID=$$(echo "$$U" | sed -n 's/^{"id":[ ]*\([0-9]*\).*/\1/p')
        [ -n "$$ID" ] || { echo "vexa user lookup failed"; exit 1; }
        P=$$(curl -sf -H "$$H" -H 'Content-Type: application/json' -X PATCH "http://admin-api:8001/admin/users/$$ID" -d '{"max_concurrent_bots":'"$$N"'}')
        echo "$$P" | grep -q '"max_concurrent_bots":[ ]*'"$$N"'[,}]' || { echo "vexa max_concurrent_bots update failed"; exit 1; }
        echo "vexa user $$ID max_concurrent_bots=$$N"
        [ -s /run/vexa/api-key ] && { echo "vexa api key already provisioned"; exit 0; }
        T=$$(curl -sf -H "$$H" -X POST "http://admin-api:8001/admin/users/$$ID/tokens?scopes=bot,tx")
        echo "$$T" | sed -n 's/.*"token":[ ]*"\([^"]*\)".*/\1/p' > /run/vexa/api-key
        [ -s /run/vexa/api-key ] && echo "vexa api key provisioned for user $$ID"
    environment:
      VEXA_ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN}
      VEXA_MAX_CONCURRENT_BOTS: ${VEXA_MAX_CONCURRENT_BOTS:-2}
    volumes:
      - vexa-provision:/run/vexa
    depends_on:
      admin-api:
        condition: service_healthy
    networks: [vexa]
    restart: on-failure

  # ─── optional debug access and log shipping (infra/dstack/DEBUG.md) ──────────────────────────
  # Remove these four services and their two volumes with a follow-up deploy when no longer needed.

  # Copies the static docker CLI and compose plugin from the pinned docker CLI image for debug-ssh.
  debug-ssh-tools:
    image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp /usr/local/bin/docker /usr/local/libexec/docker/cli-plugins/docker-compose /tools/"]
    volumes:
      - debug-ssh-tools:/tools
    network_mode: none
    restart: "no"

  # Key-only SSH for operators, reached through the dstack gateway's TLS-terminated route
  # <app_id>-2222.<gateway base_domain>:443. The one authorized public key is inlined below, so it is
  # part of the measured compose; without exactly one valid key the container refuses to start (and
  # restarts in a back-off loop), so nothing listens on 2222. The key holder is root-equivalent on the
  # CVM: the docker socket controls every container and /dstack/.decrypted-env holds every sealed value.
  debug-ssh:
    image: ghcr.io/linuxserver/openssh-server:10.3_p1-r1-ls239@sha256:0f535b0faa7448511b23528165e9fbd4f1fe563b861b3dcaa5ddb0ddbfe2254c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        key="$$DEBUG_SSH_AUTHORIZED_KEY"
        unset DEBUG_SSH_AUTHORIZED_KEY
        case "$$key" in ''|REPLACE_AT_DEPLOY) echo "debug-ssh: DEBUG_SSH_AUTHORIZED_KEY is not set in app-compose.yaml; refusing to start"; exit 1;; esac
        mkdir -p /root/.ssh /etc/ssh/hostkeys
        printf '%s\n' "$$key" > /root/.ssh/authorized_keys
        if [ "$$(wc -l < /root/.ssh/authorized_keys)" -ne 1 ] || ! ssh-keygen -l -f /root/.ssh/authorized_keys; then
          rm -f /root/.ssh/authorized_keys
          echo "debug-ssh: DEBUG_SSH_AUTHORIZED_KEY must be exactly one public key; refusing to start"
          exit 1
        fi
        [ -s /etc/ssh/hostkeys/ssh_host_ed25519_key ] || ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/hostkeys/ssh_host_ed25519_key
        echo "debug-ssh: host key $$(ssh-keygen -l -f /etc/ssh/hostkeys/ssh_host_ed25519_key.pub)"
        # root has no password ("*"); a "!" lock would also refuse key logins.
        sed -i 's/^root:!:/root:*:/' /etc/shadow
        ln -sf /opt/debug-tools/docker /usr/local/bin/docker
        mkdir -p /usr/local/libexec/docker/cli-plugins
        ln -sf /opt/debug-tools/docker-compose /usr/local/libexec/docker/cli-plugins/docker-compose
        # `dstack-compose ARGS` = `docker compose ARGS` on this CVM's project, with its sealed env.
        printf '%s\n' '#!/bin/sh' 'set -eu' 'set -a; . /dstack/.decrypted-env; set +a' \
          'exec docker compose -p dstack -f /dstack/docker-compose.yaml "$$@"' > /usr/local/bin/dstack-compose
        chmod 755 /usr/local/bin/dstack-compose
        printf '%s\n' 'Port 2222' 'HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key' \
          'AllowUsers root' 'PermitRootLogin prohibit-password' 'AuthenticationMethods publickey' \
          'PubkeyAuthentication yes' 'AuthorizedKeysFile /root/.ssh/authorized_keys' \
          'PasswordAuthentication no' 'KbdInteractiveAuthentication no' 'PermitEmptyPasswords no' 'UsePAM no' \
          'AllowTcpForwarding no' 'AllowAgentForwarding no' 'AllowStreamLocalForwarding no' \
          'X11Forwarding no' 'PermitTunnel no' 'PermitUserEnvironment no' \
          'MaxAuthTries 3' 'LoginGraceTime 30' 'LogLevel VERBOSE' > /etc/ssh/sshd_config.debug
        exec /usr/sbin/sshd.pam -D -e -f /etc/ssh/sshd_config.debug
    environment:
      # Public key only (one line: ssh-ed25519 AAAA... name). Replaced in the deploy commit; the
      # placeholder fails closed.
      DEBUG_SSH_AUTHORIZED_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPVhzzspv9XwQOZP6hAInSomSA86ROTtVZBz2tQ9DZDv ptx-dev-debug (Amos, 2026-10-23)"
    ports:
      - "2222:2222"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dstack/docker-compose.yaml:/dstack/docker-compose.yaml:ro
      - /dstack/.host-shared/.decrypted-env:/dstack/.decrypted-env:ro
      - debug-ssh-tools:/opt/debug-tools:ro
      - debug-ssh-hostkeys:/etc/ssh/hostkeys
    depends_on:
      debug-ssh-tools:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ships the stdout/stderr of an ALLOWLIST of containers to the Better Stack source ptx-dev: meeting
  # bots (container name vexa-mtg-*, not compose services) and the compose services meeting-api,
  # gateway, api, worker, probe and debug-ssh (label com.docker.compose.service). Every other container
  # is dropped in the `allowlist` filter (DEBUG.md "What is shipped"). The ingest-only token comes from
  # the sealed env, is written to a tmpfs file and removed from the environment before Vector starts;
  # without it the container refuses to start (and restarts in a back-off loop).
  debug-log-shipper:
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    init: true
    user: "0:0"   # owner access to the docker socket; every capability is dropped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      VECTOR_CONFIG_YAML: |
        data_dir: /var/lib/vector
        secret:
          local_directory:
            type: directory
            path: /run/vector-secrets
            remove_trailing_whitespace: true
        sources:
          containers:
            type: docker_logs
            exclude_containers: [dstack-debug-log-shipper-]
        transforms:
          allowlist:
            type: filter
            inputs: [containers]
            condition: |
              service = string(.label."com.docker.compose.service") ?? ""
              name = string(.container_name) ?? ""
              includes(["meeting-api", "gateway", "api", "worker", "probe", "debug-ssh"], service) || starts_with(name, "vexa-mtg-")
          shaped:
            type: remap
            inputs: [allowlist]
            source: |
              . = {"dt": .timestamp, "container": .container_name, "image": .image, "stream": .stream, "message": .message}
        sinks:
          betterstack:
            type: http
            inputs: [shaped]
            method: post
            uri: "https://s2795440.us-west-2a.betterstackdata.com/"
            encoding: { codec: json }
            compression: gzip
            auth: { strategy: bearer, token: "SECRET[local_directory.betterstack_source_token]" }
            batch: { max_bytes: 4000000, timeout_secs: 5 }
            buffer: { type: memory, max_events: 1000, when_full: drop_newest }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        [ -n "$${BETTERSTACK_SOURCE_TOKEN}" ] || { echo "debug-log-shipper: BETTERSTACK_SOURCE_TOKEN is empty; refusing to start"; exit 1; }
        printf '%s' "$${BETTERSTACK_SOURCE_TOKEN}" > /run/vector-secrets/betterstack_source_token
        unset BETTERSTACK_SOURCE_TOKEN
        printf '%s\n' "$${VECTOR_CONFIG_YAML}" > /var/lib/vector/vector.yaml
        unset VECTOR_CONFIG_YAML
        exec vector --config /var/lib/vector/vector.yaml
    tmpfs:
      - /var/lib/vector:mode=0700,size=16m
      - /run/vector-secrets:mode=0700,size=1m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Read-only status probe, run on demand only (`compose up` never starts a profile service).
  # PROBE_MEETING_IDS = comma-separated Vexa meeting ids. Prints one JSON line per database to
  # stdout, which debug-log-shipper carries to Better Stack. No meeting URLs or content columns.
  probe:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["probe"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ids="$$PROBE_MEETING_IDS"
        case "$$ids" in ''|,*|*,|*,,*|*[!0-9,]*) echo "probe: PROBE_MEETING_IDS must be comma-separated meeting ids" >&2; exit 2;; esac
        export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=5000' PGCONNECT_TIMEOUT=5
        PGPASSWORD="$$PTX_DB_PASSWORD" psql -X -q -At -v ON_ERROR_STOP=1 -v ids="$$ids" -h postgres -U ptx -d ptx <<'SQL'
        SELECT jsonb_build_object('probe', 'ptx', 'ids', :'ids', 'rows', COALESCE(jsonb_agg(to_jsonb(t) ORDER BY t.created_at), '[]'::jsonb))
        FROM (
          SELECT id, status, error_code, platform, vexa_meeting_id, created_at, started_at, ended_at,
                 capture_diagnostics->>'provider_status'   AS provider_status,
                 capture_diagnostics->>'completion_reason' AS completion_reason,
                 capture_diagnostics->>'failure_stage'     AS failure_stage,
                 capture_diagnostics->'transitions'        AS transitions,
                 capture_diagnostics->>'stop_requested_by' AS stop_requested_by
          FROM meetings
          WHERE vexa_meeting_id = ANY (string_to_array(:'ids', ',')::int[])
        ) t;
        SQL
        PGPASSWORD="$$VEXA_DB_PASSWORD" psql -X -q -At -v ON_ERROR_STOP=1 -v ids="$$ids" -h vexa-postgres -U postgres -d vexa <<'SQL'
        SELECT jsonb_build_object('probe', 'vexa', 'ids', :'ids', 'rows', COALESCE(jsonb_agg(to_jsonb(t) ORDER BY t.id), '[]'::jsonb))
        FROM (
          SELECT id, platform, status, created_at, start_time, end_time,
                 data->'status_transition'  AS transitions,
                 data->>'completion_reason' AS completion_reason,
                 data->>'failure_stage'     AS failure_stage,
                 data->'join_evidence'      AS join_evidence
          FROM meetings
          WHERE id = ANY (string_to_array(:'ids', ',')::int[])
        ) t;
        SQL
    environment:
      PROBE_MEETING_IDS: ${PROBE_MEETING_IDS:-}
      PTX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      VEXA_DB_PASSWORD: ${VEXA_DB_PASSWORD}
    networks: [ptx, vexa]
    restart: "no"

volumes:
  ptx-postgres:
  ptx-redis:
  vexa-postgres:
  vexa-redis:
  minio-data:
  minio-retention:
  whisper-cache:
  vexa-provision:
  signal-profile:
  # Legacy name retained to preserve the existing capability key across in-place upgrades.
  signal-runtime:
  # Legacy seat-1 health volume name is retained across in-place upgrades.
  signal-health:
  signal-control-1:
  debug-ssh-tools:
  debug-ssh-hostkeys:

networks:
  ptx: {}
  vexa:
    name: ptx-vexa   # fixed: runtime's DOCKER_NETWORK must equal this (bots are attached here)
  signal-seat-1:
    internal: true

# Operational notes
# - Bootstrap an API key for callers: `phala ssh -- docker exec <api container> bun run src/cli.ts create-key --project demo`.
# - Sizing (docs/vexa-findings.md): whisper small.en ~1.4 GB RSS + ~10 cores while decoding, one bot
#   ~470 MB + Chromium launch burst, control plane ~1 GB → tdx.large (4 vCPU / 8 GB) is the smallest
#   viable dev size; production wants ≥ tdx.xlarge. Disk ≥ 40 GB (bot image 3.6 GB + whisper model + recordings).
#   Measured on ptx-dev (TC-900, Oct 2026): a Google Meet bot holds ~1-1.2 GB; two Meet bots next to a
#   pinned 2.45 GB Whisper and three Signal seats OOM-killed a bot. Raise VEXA_MAX_CONCURRENT_BOTS only
#   with more RAM. The Vexa v0.12 runtime sets no memory limit on bot containers and has no setting for one.
# - Disk (TC-904): GET /health → checks.disk; the worker logs "disk usage above high-water mark" at
#   DISK_HIGH_WATER_PERCENT (80). `docker exec <worker> bun run src/cli.ts artifact-retention` prints the
#   MinIO retention plan per Vexa meeting without deleting; the bot-janitor logs what it removes.
# - Egress: bots join public meetings over the CVM's NAT. Published: :8080 (our API) and, while the debug
#   sidecars are deployed, :2222 (debug-ssh, key-only).
