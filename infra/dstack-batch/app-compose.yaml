# ptx-batch: the dedicated batch-transcription CVM (PTX_ROLE=batch). It runs no meeting workload: no Vexa,
# Redis, Signal seats, Whisper or docker.sock. Only :8080 is published (api: health, /v1/transcriptions*,
# /v1/admin/*, PUT /uploads/{id}). Runbook: infra/dstack-batch/README.md.
#
# Sealed env (phala deploy -e, see .env.example; values never live in this file):
#   POSTGRES_PASSWORD      internal Postgres password
#   BATCH_TINFOIL_API_KEY  the owner's dedicated batch Tinfoil key
#   PTX_BOOTSTRAP_KEYS     hashed API keys: tinychat (transcriptions:*) and owner-admin (admin:*)
#   BETTERSTACK_SOURCE_TOKEN  ingest-only token, interpolated by Vector at startup
#
# The api/worker image is an immutable pin that only a PR changes; it cannot be overridden from the sealed env.
# Until the first batch image exists (P2 merged → publish-image.yml), it is the placeholder below, which
# .github/workflows/deploy-batch.yml refuses to deploy.
#
# Sized for Phala tdx.small (1 vCPU, 2048 MB; the guest sees 1,853 MiB). The four services are capped at 896 MiB
# together (api 320m + worker 320m + postgres 192m + log-shipper 64m), leaving 1,003,282,432 B for guest OS,
# dstack and dockerd. There is no Fluentd daemon queue. The 1,000-event Vector sink buffer is in its 64 MiB cgroup.
#
# Docker's JSON file caps are 10m × 3 for each of api, worker, postgres and Vector: 120m maximum on the 20G disk.
# App JSON lines are bounded at 16 KiB; Docker's JSON escaping can at most double the serialized inner line, plus
# 1 KiB of envelope metadata: 33 KiB < Vector max_line_bytes 65,536. Rotated files are included by the source glob.
#
# Postgres remains unlabelled and capped json-file: its diagnostic output can contain SQL/error context and is not safe
# telemetry. Vector is also unlabelled and capped json-file; its own lines are dropped by the first raw-label gate.
# The batch-envelope.yml 2-hour stereo proof should be rerun.
services:
  api:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:508cb0be60a27e6b2bb4eefd888ad7c98954c3e5@sha256:72568fe357e87aefb13a4430b0124b16a4c5e98395281e80e9ee09471c9aaf4d
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PTX_ROLE: batch
      PORT: "8080"
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ptx
      AUTO_MIGRATE: "true"
      PTX_BOOTSTRAP_KEYS: "${PTX_BOOTSTRAP_KEYS:-}"
      BATCH_UPLOAD_DIR: /var/lib/ptx-batch/uploads
      BATCH_TINFOIL_BASE_URL: https://inference.tinfoil.sh
      BATCH_TINFOIL_API_KEY: ${BATCH_TINFOIL_API_KEY:-}
      BATCH_TINFOIL_MODEL: voxtral-small-24b
      BATCH_MAX_ACTIVE_JOBS: "10"
      BATCH_MAX_RESERVED_BYTES: "1209600000"
      BATCH_MAX_CONCURRENT_UPLOADS: "3"
      BATCH_DISK_HIGH_WATER_PERCENT: "80"
      BATCH_TENANT_DAILY_BYTES: "362880000"
      BATCH_UPLOAD_MAX_PUT_SECONDS: "1800"
      BATCH_UPLOAD_MIN_BYTES_PER_SECOND: "32768"
      BATCH_CORS_ORIGINS: "https://tinycloud.chat,https://tinychat-4jq.pages.dev,https://*.tinychat-4jq.pages.dev,tauri://localhost,http://tauri.localhost,capacitor://localhost,https://localhost"
      BATCH_DIARIZATION_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - ptx-batch-uploads:/var/lib/ptx-batch/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 320m
    memswap_limit: 320m
    mem_reservation: 96m
    labels:
      tc.logship: ptx-batch-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: tc.logship

  upload-worker:
    image: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:508cb0be60a27e6b2bb4eefd888ad7c98954c3e5@sha256:72568fe357e87aefb13a4430b0124b16a4c5e98395281e80e9ee09471c9aaf4d
    restart: unless-stopped
    command: ["bun", "run", "src/uploads/worker.ts"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      PTX_ROLE: batch
      DATABASE_URL: postgres://ptx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ptx
      BATCH_UPLOAD_DIR: /var/lib/ptx-batch/uploads
      BATCH_TINFOIL_BASE_URL: https://inference.tinfoil.sh
      BATCH_TINFOIL_API_KEY: ${BATCH_TINFOIL_API_KEY:-}
      BATCH_TINFOIL_MODEL: voxtral-small-24b
      BATCH_DIARIZATION_ENABLED: "true"
      # Runtime rollback for newly detected jobs; the sealed deploy env can override this one flag.
      BATCH_VAD_QUIET_MODE: "${BATCH_VAD_QUIET_MODE:-true}"
      LOG_LEVEL: info
    volumes:
      - ptx-batch-uploads:/var/lib/ptx-batch/uploads
    mem_limit: 320m
    memswap_limit: 320m
    mem_reservation: 96m
    labels:
      tc.logship: ptx-batch-worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: tc.logship

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB",
      "-c", "maintenance_work_mem=16MB", "-c", "max_wal_size=256MB"]
    mem_limit: 192m
    memswap_limit: 192m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_USER: ptx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ptx
    volumes:
      - ptx-batch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptx"]
      interval: 5s
      timeout: 5s
      retries: 30

  log-shipper:
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
    configs:
      - source: vector-config
        target: /etc/vector/vector.yaml
    volumes:
      - type: bind
        source: /var/lib/docker/containers
        target: /host/containers
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ptx-batch-vector-data
        target: /var/lib/vector
    command: ["--dangerously-allow-env-var-interpolation", "--config", "/etc/vector/vector.yaml"]

configs:
  vector-config:
    file: ./log-shipper/vector.yaml

volumes:
  ptx-batch-data: {}
  ptx-batch-uploads: {}
  ptx-batch-vector-data: {}

