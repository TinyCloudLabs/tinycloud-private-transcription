name: Test
# Unit + integration suite (`bun run test`) against the dev Postgres/Redis from
# docker-compose.dev.yml. The e2e suite needs the local capture rig and is not run here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Signal seat image
        run: docker build --file infra/signal-seat/Dockerfile --tag ptx-signal-seat:test .

      - name: Start Postgres + Redis
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Run tests
        run: bun run test
