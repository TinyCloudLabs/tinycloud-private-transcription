name: Test
# Unit + integration suite (`bun run test`) against the dev Postgres/Redis from
# docker-compose.dev.yml. The e2e suite needs the local capture rig and is not run here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Vector allowlist
        run: |
          set -euo pipefail
          secrets_dir="$(mktemp -d)"
          trap 'rm -rf "$secrets_dir"' EXIT
          printf '%s' "test-token" > "$secrets_dir/bs_token"
          sudo docker run --rm \
            -v "$PWD/infra/dstack-batch/log-shipper:/vector-config:ro" \
            -v "$secrets_dir:/run/vector-secrets:ro" \
            timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a \
            test /vector-config/vector.yaml /vector-config/vector.tests.yaml

      - name: Build Signal seat image
        run: docker build --file infra/signal-seat/Dockerfile --tag ptx-signal-seat:test .

      - name: Generate a throwaway Postgres password
        # No credential is committed (TC-929). Each run makes its own for the ephemeral compose Postgres,
        # masks it, and exports POSTGRES_PASSWORD (read by docker-compose.dev.yml) and DATABASE_URL.
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://ptx:$password@localhost:55432/ptx" >> "$GITHUB_ENV"

      - name: Start Postgres + Redis
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Run tests
        run: bun run test

  image:
    # The production runtime is the Alpine (musl) Bun in the api image, not the glibc Bun above. Build that image
    # from this commit and run the Bun.SQL concurrency regression test and the Redis queue test inside it, against
    # the same dev Postgres/Redis. test/ is mounted read-only; the image itself is unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the api image
        run: docker build --tag ptx-api:test .

      - name: Generate a throwaway Postgres password
        # No credential is committed (TC-929). Each run makes its own for the ephemeral compose Postgres,
        # masks it, and exports POSTGRES_PASSWORD (read by docker-compose.dev.yml) and DATABASE_URL.
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://ptx:$password@localhost:55432/ptx" >> "$GITHUB_ENV"

      - name: Start Postgres + Redis
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Run tests inside the api image
        run: |
          set -euo pipefail
          in_image() { docker run --rm --network host --env DATABASE_URL --volume "$PWD/test:/app/test:ro" ptx-api:test "$@"; }
          in_image bun --version
          in_image bun test test/integration/batch-api.test.ts --test-name-pattern "cold connection pool"
          in_image bun test test/unit/queue.test.ts
