name: Publish image
# Builds the api/worker and Signal Desktop seat images (linux/amd64 only — Phala CVMs are TDX x86_64)
# and pushes it to GHCR with the workflow's GITHUB_TOKEN. Tags:
#   ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:<git sha>   (immutable; pin this in app-compose.yaml)
#   ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:v1          (moving; on feat/v1 + main)
#   ghcr.io/tinycloudlabs/tinycloud-private-transcription/api:latest      (moving; on main only)
# The package must be PUBLIC for the CVM to pull it anonymously. The `.../api` package was created by this workflow
# after the repo went public, so it inherits public visibility (org.opencontainers.image.source links it to the repo).
# The older `ghcr.io/tinycloudlabs/tinycloud-private-transcription` package (created while the repo was private) is
# DEPRECATED — it is stuck private and is no longer pushed to.

on:
  push:
    branches: [main, feat/v1]
    paths:
      - Dockerfile
      - package.json
      - bun.lock
      - drizzle.config.ts
      - tsconfig.json
      - src/**
      - infra/signal-seat/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/tinycloudlabs/tinycloud-private-transcription/api
  SEAT_IMAGE: ghcr.io/tinycloudlabs/tinycloud-private-transcription/signal-seat

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          tags="${API_IMAGE}:${GITHUB_SHA}"$'\n'"${API_IMAGE}:v1"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then tags="${tags}"$'\n'"${API_IMAGE}:latest"; fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TinyCloud Private Transcription api/worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-signal-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          tags="${SEAT_IMAGE}:${GITHUB_SHA}"$'\n'"${SEAT_IMAGE}:v1"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then tags="${tags}"$'\n'"${SEAT_IMAGE}:latest"; fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Signal seat
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/signal-seat/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TinyCloud Signal Desktop capture seat
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Signal seat image"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
