name: Tinfoil credit probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ptx-batch
    timeout-minutes: 2
    env:
      BATCH_TINFOIL_API_KEY: ${{ secrets.BATCH_TINFOIL_API_KEY }}
      BATCH_TINFOIL_BASE_URL: ${{ vars.BATCH_TINFOIL_BASE_URL || 'https://inference.tinfoil.sh' }}
      BATCH_TINFOIL_MODEL: ${{ vars.BATCH_TINFOIL_MODEL || 'voxtral-small-24b' }}
    steps:
      - name: Probe Tinfoil
        shell: bash
        run: |
          set +x
          printf '::add-mask::%s\n' "$BATCH_TINFOIL_API_KEY"

          python3 - <<'PY'
          import wave

          with wave.open("silence.wav", "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(16000)
              wav.writeframes(b"\0\0" * 16000)
          PY

          if status=$(printf 'Authorization: Bearer %s\n' "$BATCH_TINFOIL_API_KEY" | curl \
            --silent \
            --output body.json \
            --write-out '%{http_code}' \
            --max-time 60 \
            --request POST \
            --header @- \
            --form 'file=@silence.wav;type=audio/wav' \
            --form "model=$BATCH_TINFOIL_MODEL" \
            --form 'response_format=json' \
            "${BATCH_TINFOIL_BASE_URL%/}/v1/audio/transcriptions"); then
            :
          else
            :
          fi

          printf 'HTTP status: %s\n' "$status"
          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            printf 'ok\n'
          else
            jq -r '"error.code: \((.error.code // "null") | tostring)\nerror.type: \((.error.type // "null") | tostring)\nerror.message: \((.error.message // "null") | tostring | .[0:300])"' body.json 2>/dev/null || true
          fi
          rm -f body.json silence.wav
