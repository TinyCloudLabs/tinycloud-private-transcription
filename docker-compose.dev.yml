# Local Postgres + Redis for development and `bun test`.
#   cp .env.example .env    # then set POSTGRES_PASSWORD (README "Run locally"); compose reads ./.env
#   sudo docker compose -f docker-compose.dev.yml up -d
# Ports bind to 127.0.0.1 only: on a shared, internet-facing host a bare "55432:5432" is published on every
# interface, and Docker's forwarding bypasses ufw (TC-929). Keep any port you add here on 127.0.0.1.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ptx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Generate one with `openssl rand -hex 24` and put it in .env (see .env.example)}
      POSTGRES_DB: ptx
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptx"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
